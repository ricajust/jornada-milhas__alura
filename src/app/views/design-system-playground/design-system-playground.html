<div class="playground">

  <h1>Design System Playground</h1>

  <!-- ========================= -->
  <!-- Typography -->
  <!-- ========================= -->

  <section>
    <h2>Typography</h2>

    <div class="typography-example display-large">
      Display Large
    </div>

    <div class="typography-example headline-large">
      Headline Large
    </div>

    <div class="typography-example body-large">
      Body Large — Lorem ipsum dolor sit amet.
    </div>
  </section>


  <!-- ========================= -->
  <!-- Colors -->
  <!-- ========================= -->

  <section>
    <h2>Colors</h2>

    <div class="colors">

      <div class="color-card primary">
        <span>Primary</span>
        <small>#6750A4</small>
      </div>

      <div class="color-card secondary">
        <span>Secondary</span>
        <small>#625B71</small>
      </div>

      <div class="color-card error">
        <span>Error</span>
        <small>#B3261E</small>
      </div>

      <div class="color-card accent">
        <span>Accent</span>
        <small>#FF9431</small>
      </div>

    </div>
  </section>


  <!-- ========================= -->
  <!-- Buttons -->
  <!-- ========================= -->

  <section>
    <h2>Buttons</h2>

    <div class="component-row">

      <button mat-flat-button>
        Primary
      </button>

      <button mat-stroked-button>
        Secondary
      </button>

      <button mat-button>
        Text button
      </button>

      <button mat-flat-button disabled>
        Disabled
      </button>

    </div>
  </section>


  <!-- ========================= -->
  <!-- Forms -->
  <!-- ========================= -->

  <section>
    <h2>Form</h2>

    <div class="form-row">

      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput placeholder="Digite seu nome">
      </mat-form-field>


      <mat-form-field appearance="outline">
        <mat-label>Categoria</mat-label>

        <mat-select>
          <mat-option value="one">
            Opção 1
          </mat-option>

          <mat-option value="two">
            Opção 2
          </mat-option>

          <mat-option value="three">
            Opção 3
          </mat-option>
        </mat-select>

      </mat-form-field>

    </div>
  </section>


  <!-- ========================= -->
  <!-- Components -->
  <!-- ========================= -->

  <section>

    <h2>Components</h2>

    <div class="component-row">

      <mat-card>
        <mat-card-header>
          <mat-card-title>
            Card
          </mat-card-title>
        </mat-card-header>

        <mat-card-content>
          Exemplo de Card do Angular Material.
        </mat-card-content>

        <mat-card-actions>
          <button mat-button>
            Ação
          </button>
        </mat-card-actions>
      </mat-card>


      <mat-checkbox>
        Checkbox
      </mat-checkbox>

    </div>

  </section>

</div>
